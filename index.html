<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compositor Inteligente Rooh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto">
  <div class="text-center my-6">
    <h1 class="text-2xl font-bold text-indigo-400">🎵 Compositor Rooh</h1>
    <p class="text-xs text-slate-400 mt-1">Crie músicas incríveis com voz e estilo!</p>
  </div>

  <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Gênero / Estilo Musical</label>
      <select id="genre" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
        <option value="Sertanejo">Sertanejo</option>
        <option value="Pop">Pop</option>
        <option value="Rock">Rock</option>
        <option value="MPB">MPB</option>
        <option value="Samba / Pagode">Samba / Pagode</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Voz do Cantor(a)</label>
      <div class="grid grid-cols-2 gap-2">
        <label class="flex items-center justify-center p-2.5 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer text-sm">
          <input type="radio" name="voice" value="Masculina" checked class="mr-2 accent-indigo-500"> Voz Masculina
        </label>
        <label class="flex items-center justify-center p-2.5 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer text-sm">
          <input type="radio" name="voice" value="Feminina" class="mr-2 accent-indigo-500"> Voz Feminina
        </label>
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Ideia ou Letra da Música</label>
      <textarea id="prompt" rows="3" placeholder="Ex: Uma música romântica sobre uma viagem inesquecível..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white placeholder-slate-500"></textarea>
    </div>

    <button id="btnGerar" onclick="gerarMusica()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg shadow transition text-sm flex items-center justify-center gap-2">
      ✨ Criar Minha Música
    </button>
  </div>

  <div id="resultado" class="hidden mt-6 bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
    <h3 class="font-bold text-indigo-300 text-sm text-center">🎶 Letra Composta com Sucesso!</h3>
    
    <div id="letraContainer" class="bg-slate-900 p-4 rounded-lg text-sm text-slate-200 whitespace-pre-line leading-relaxed border border-slate-700 max-h-80 overflow-y-auto">
      <!-- A letra gerada pelo Gemini aparecerá aqui -->
    </div>

    <div class="flex gap-2 pt-2">
      <button onclick="copiarLetra()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1">
        📋 Copiar Letra
      </button>
      <button onclick="compartilharWhatsApp()" class="flex-1 bg-green-600 hover:bg-green-500 text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1">
        💬 WhatsApp
      </button>
    </div>
  </div>

  <script>
    const API_KEY = "AIzaSyBWSCIrXVvKAIhIHMj2kBkKR7ljBmal1FQ";
    let letraAtual = "";

    async function gerarMusica() {
      const prompt = document.getElementById('prompt').value.trim();
      const genre = document.getElementById('genre').value;
      const voice = document.querySelector('input[name="voice"]:checked').value;
      const btn = document.getElementById('btnGerar');
      const resultadoDiv = document.getElementById('resultado');
      const letraContainer = document.getElementById('letraContainer');

      if (!prompt) { 
        alert('Por favor, digite uma ideia para a música!'); 
        return; 
      }

      btn.disabled = true;
      btn.innerHTML = '⏳ Compondo a música com IA...';
      resultadoDiv.classList.add('hidden');

      const instrucaoPrompt = `Você é um compositor profissional. Crie uma letra de música inédita e completa no estilo ${genre}, pensando na interpretação de uma ${voice}.
Tema/Ideia: "${prompt}".
A letra deve conter: [Verso 1], [Refrão], [Verso 2], [Refrão], [Ponte] e [Final]. Coloque também um título incrível no início.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: instrucaoPrompt }] }]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          letraAtual = data.candidates[0].content.parts[0].text;
          letraContainer.innerText = letraAtual;
          resultadoDiv.classList.remove('hidden');
        } else {
          alert('Houve um erro ao gerar a música. Verifique a chave de API ou tente novamente.');
        }
      } catch (error) {
        console.error(error);
        alert('Erro ao conectar com a IA do Gemini.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '✨ Criar Minha Música';
      }
    }

    function copiarLetra() {
      if (!letraAtual) return;
      navigator.clipboard.writeText(letraAtual);
      alert('Letra copiada para a área de transferência!');
    }

    function compartilharWhatsApp() {
      if (!letraAtual) return;
      const texto = encodeURIComponent(`Olha a música que criei no Compositor Rooh! 🎶\n\n${letraAtual.substring(0, 500)}...`);
      window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
    }
  </script>
</body>
</html>
