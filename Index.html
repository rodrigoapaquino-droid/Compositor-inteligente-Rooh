<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compositor Inteligente Rooh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto">
  <div class="text-center my-6">
    <h1 class="text-2xl font-bold text-indigo-400">🎵 Compositor Rooh</h1>
    <p class="text-xs text-slate-400 mt-1">Crie músicas incríveis com voz e estilo!</p>
  </div>

  <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Gênero / Estilo Musical</label>
      <select id="genre" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
        <option value="Sertanejo">Sertanejo</option>
        <option value="Pop">Pop</option>
        <option value="Rock">Rock</option>
        <option value="MPB">MPB</option>
        <option value="Samba / Pagode">Samba / Pagode</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Voz do Cantor(a)</label>
      <div class="grid grid-cols-2 gap-2">
        <label class="flex items-center justify-center p-2.5 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer text-sm">
          <input type="radio" name="voice" value="Masculina" checked class="mr-2 accent-indigo-500"> Voz Masculina
        </label>
        <label class="flex items-center justify-center p-2.5 bg-slate-900 rounded-lg border border-slate-700 cursor-pointer text-sm">
          <input type="radio" name="voice" value="Feminina" class="mr-2 accent-indigo-500"> Voz Feminina
        </label>
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Ideia ou Letra da Música</label>
      <textarea id="prompt" rows="3" placeholder="Ex: Uma música romântica sobre uma viagem inesquecível..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white placeholder-slate-500"></textarea>
    </div>

    <button onclick="gerarMusica()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg shadow transition text-sm">
      ✨ Criar Minha Música
    </button>
  </div>

  <div id="resultado" class="hidden mt-6 bg-slate-800 p-4 rounded-xl border border-slate-700 text-center space-y-3">
    <h3 class="font-bold text-indigo-300 text-sm">Música Gerada com Sucesso!</h3>
    <audio id="audioPlayer" controls class="w-full mt-2"></audio>
    <div class="flex gap-2">
      <a id="downloadBtn" download="minha-musica.mp3" class="flex-1 bg-emerald-600 text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1">
        ⬇️ Baixar MP3
      </a>
      <button onclick="compartilharWhatsApp()" class="flex-1 bg-green-600 text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1">
        💬 WhatsApp
      </button>
    </div>
  </div>

  <script>
    function gerarMusica() {
      const prompt = document.getElementById('prompt').value;
      if (!prompt) { alert('Por favor, digite uma ideia para a música!'); return; }
      
      alert('Sua solicitação foi enviada! O aplicativo está processando a faixa.');
      document.getElementById('resultado').classList.remove('hidden');
    }

    function compartilharWhatsApp() {
      const texto = encodeURIComponent("Criei uma nova música com o meu aplicativo Compositor Rooh! 🎶");
      window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
    }
  </script>
</body>
</html>
